<ion-header #Header>
  <ui-status-border [hide]="hideHeader"></ui-status-border>
</ion-header>
<ion-content [scrollEvents]="true" HideOverlay (hide)="hideHeader = $event">
  <ui-hide-header [hide]="hideHeader">
    <ion-toolbar color="primary">
      <ion-searchbar #SearchBar class="p-0 shadow-none mx-2" color="primary" [value]="filter?.query" (ionChange)="onSearchChange($event)"></ion-searchbar>
          <ion-buttons slot="primary">
            <ion-button (click)="openEditor()">
              <ion-icon slot="icon-only" name="filter" [style]="filterStyle()"></ion-icon>
            </ion-button>
          </ion-buttons>
    </ion-toolbar>
  </ui-hide-header>
  @if (filter == null) {
    <views-home-sub-view></views-home-sub-view>
  }
  @else if (loading) {
    <div class="position-relative h-100 w-100">
      <div class="position-absolute top-50 start-50 translate-middle"><ion-spinner></ion-spinner></div>
    </div>
  }
  @else if (amountFound > -1) {
    @if (amountFound > 0) {
      <div class="mx-3 mt-3"><span>{{ amountFound | number }} Found</span></div>
    }
    @for (work of works; track work.id) {
      <div class="mx-2 mt-3"><ui-search-card [work]="work"></ui-search-card></div>
    }
    @if (!searchEnd) {
      <ion-infinite-scroll (ionInfinite)="onSearchNext($event)">
        <ion-infinite-scroll-content></ion-infinite-scroll-content>
      </ion-infinite-scroll>
    }
    @else {
      @if (amountFound > 0) {
        <div class="d-flex w-100">
          <div class="mx-auto my-4 opacity-50"><span>Ran out of works :/</span></div>
        </div>
      }
      @else {
        <div class="d-flex w-100 h-100">
          <div class="m-auto opacity-50"><h1>Nothin' here yet :3</h1></div>
        </div>
      }
    }
  }
</ion-content>
