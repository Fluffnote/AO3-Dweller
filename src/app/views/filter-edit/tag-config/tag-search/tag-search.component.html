<div class="">
  <div class="my-1">
    @for (tag of tags; track tag) {
      <ion-chip>{{tag}}<ion-icon name="close-circle" (click)="removeTag(tag)"></ion-icon></ion-chip>
    }
  </div>
  <ion-button [id]="id+'-open-search'" expand="block" fill="outline" (click)="searchTags=[]">Add {{ label }}</ion-button>

  <ion-modal #modal [trigger]="id+'-open-search'" [initialBreakpoint]="0.25" [breakpoints]="[0, 0.25, 0.5, 0.75]">
    <ng-template>
      <ion-content>
        <ion-searchbar [placeholder]="'Search '+label" [debounce]="300" (click)="modal.setCurrentBreakpoint(0.75)" (ionInput)="search($event)"></ion-searchbar>
        <ion-list lines="full">
          @for (tag of searchTags; track tag) {
            <ion-item [button]="true" (click)="toggleTag(tag)">
              <ion-label>{{tag}}</ion-label>
              <ion-icon slot="end" [name]="searchTagIcon(tag)"></ion-icon>
            </ion-item>
          }
        </ion-list>
      </ion-content>
    </ng-template>
  </ion-modal>
</div>
